# VECTORD OS - GRUB Configuration

set timeout=5
set default=0

# Hide cursor for cleaner look
set color_normal=white/black
set color_highlight=black/white

menuentry "VECTORD OS v2.0.1 - Live Desktop" {
    multiboot /boot/vectord-kernel
}

menuentry "VECTORD OS v2.0.1 - Serial Mode" {
    multiboot /boot/vectord-kernel serial
}

